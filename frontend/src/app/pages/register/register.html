<div class="register-page">

  <div class="register-card">

    <div class="register-header">

      <div class="logo">
        🧠
      </div>

      <h1>Create Account</h1>

      <p>
        Create your account and start generating AI quizzes.
      </p>

    </div>


    <form (ngSubmit)="register()">

      <div class="form-group">

        <label for="name">
          Name
        </label>

        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Enter your name"
          autocomplete="name"
        />

      </div>


      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          autocomplete="email"
        />

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Create a password"
          autocomplete="new-password"
        />

      </div>


      @if (errorMessage()) {

        <div class="error-message">
          {{ errorMessage() }}
        </div>

      }


      @if (successMessage()) {

        <div class="success-message">
          {{ successMessage() }}
        </div>

      }


      <button
        type="submit"
        [disabled]="loading()"
      >

        @if (loading()) {
          Creating account...
        } @else {
          Create Account
        }

      </button>

    </form>


    <div class="register-footer">

      <span>
        Already have an account?
      </span>

      <a routerLink="/login">
        Login
      </a>

    </div>

  </div>

</div>
